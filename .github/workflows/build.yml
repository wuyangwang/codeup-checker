name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'
        cache: true
    
    - name: Check code
      run: go vet ./...
    
    - name: Build
      run: go build -v ./...
    
    - name: Test
      run: go test -v ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'
        cache: true
    
    - name: Build binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o codeup-checker-linux-amd64 ./cmd/codeup-checker/
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o codeup-checker-darwin-amd64 ./cmd/codeup-checker/
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o codeup-checker-darwin-arm64 ./cmd/codeup-checker/
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o codeup-checker-windows-amd64.exe ./cmd/codeup-checker/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        files: |
          codeup-checker-linux-amd64
          codeup-checker-darwin-amd64
          codeup-checker-darwin-arm64
          codeup-checker-windows-amd64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}